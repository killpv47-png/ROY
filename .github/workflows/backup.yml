# Encrypted logical backup of application tables. Credentials stay encrypted (nothing is decrypted);
# the whole export is additionally encrypted with APP_ENCRYPTION_KEY before upload.
name: backup

on:
  schedule:
    - cron: "5 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      APP_ENCRYPTION_KEY: ${{ secrets.APP_ENCRYPTION_KEY }}
    steps:
      - name: Check secrets
        run: |
          for v in DATABASE_URL APP_ENCRYPTION_KEY; do
            if [ -z "${!v}" ]; then echo "::error::$v secret is required"; exit 1; fi
          done
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Export encrypted backup
        run: |
          mkdir -p backup
          python -m cr_analyst export-backup "backup/cr-analyst-$(date -u +%Y-%m-%d).enc"
      - uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: backup/
          retention-days: 30
