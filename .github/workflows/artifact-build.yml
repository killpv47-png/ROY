# Builds the clean source ZIP (no secrets, no databases, no caches), verifies it, and uploads it.
# On a pushed tag v*, the ZIP is also attached to a GitHub Release.
name: artifact-build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Test before packaging
        run: |
          python scripts/check_i18n.py
          python -m pytest -q
      - name: Build clean ZIP
        run: python -m cr_analyst build-zip dist/cr-analyst.zip
      - name: Verify ZIP contents
        run: python scripts/verify_zip.py dist/cr-analyst.zip
      - uses: actions/upload-artifact@v4
        with:
          name: cr-analyst-source
          path: dist/cr-analyst.zip
          retention-days: 30
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/cr-analyst.zip --clobber
