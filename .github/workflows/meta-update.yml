# Official balance-change research (Supercell blog) on a schedule, independent of the bot worker.
name: meta-update

on:
  schedule:
    - cron: "40 */6 * * *"
  workflow_dispatch:
    inputs:
      max_articles:
        description: "How many recent official articles to check"
        required: false
        default: "6"

permissions:
  contents: read

concurrency:
  group: meta-update
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      APP_ENCRYPTION_KEY: ${{ secrets.APP_ENCRYPTION_KEY }}
      CLASH_API_TOKEN: ${{ secrets.CLASH_API_TOKEN }}
      TAVILY_KEY: ${{ secrets.TAVILY_KEY }}
    steps:
      - name: Require a persistent database
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::error::DATABASE_URL secret is required"; exit 1; fi
          case "$DATABASE_URL" in sqlite*) echo "::error::meta-update needs a persistent PostgreSQL database"; exit 1;; esac
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python scripts/db_migrate.py
      - name: Research official balance changes
        run: python -m cr_analyst meta-update --max-articles "${{ github.event.inputs.max_articles || '6' }}" --catalog-fallback | tee meta-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meta-report-${{ github.run_id }}
          path: meta-report.json
          retention-days: 14
          if-no-files-found: ignore
