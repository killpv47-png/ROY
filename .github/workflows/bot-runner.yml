# Long-running Telegram worker on GitHub-hosted runners (best-effort hosting).
# Each run works ~330 min (MAX_RUNTIME_MINUTES), saves a checkpoint, releases the DB lease and
# dispatches the next run through the REST API with GH_PAT (GITHUB_TOKEN cannot trigger new runs).
# The 350-min job timeout leaves a safety margin below GitHub's 6-hour hard limit.
name: bot-runner

on:
  workflow_dispatch:
    inputs:
      chain_index:
        description: "Chain index (0 = manual start; incremented automatically on every chained run)"
        required: false
        default: "0"
      reason:
        description: "Why this run was started"
        required: false
        default: "manual"
  schedule:
    # Watchdog: if the chain was broken (crash, cancelled run), restart within 6 h.
    # If a worker is already active the new run cannot acquire the DB lease and exits within minutes.
    - cron: "17 */6 * * *"

# Never run two workers at once. A newer queued run waits; it does not cancel the active worker.
concurrency:
  group: bot-runner
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      GH_PAT: ${{ secrets.GH_PAT }}
      ADMIN_ID: ${{ secrets.ADMIN_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      APP_ENCRYPTION_KEY: ${{ secrets.APP_ENCRYPTION_KEY }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      CLASH_API_TOKEN: ${{ secrets.CLASH_API_TOKEN }}
      TAVILY_KEY: ${{ secrets.TAVILY_KEY }}
      EXPECTED_EGRESS_IP: ${{ vars.EXPECTED_EGRESS_IP }}
      MAX_RUNTIME_MINUTES: ${{ vars.MAX_RUNTIME_MINUTES || '330' }}
      MAX_AUTO_RESTARTS: ${{ vars.MAX_AUTO_RESTARTS || '120' }}
      RESUME_DELAY_SECONDS: ${{ vars.RESUME_DELAY_SECONDS || '10' }}
      RUNNER_WORKFLOW_FILE: bot-runner.yml
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Validate required secrets
        run: |
          missing=""
          for v in BOT_TOKEN DATABASE_URL APP_ENCRYPTION_KEY; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required repository secrets:$missing"; exit 1
          fi
          case "$DATABASE_URL" in
            sqlite*) echo "::warning::SQLite on an ephemeral runner is NOT persistent. Use PostgreSQL.";;
          esac
          [ -z "$GH_PAT" ] && echo "::warning::GH_PAT not set: the worker cannot chain the next run automatically."
          [ -z "$LLM_API_KEY" ] && echo "::notice::LLM_API_KEY not set: free-form AI answers disabled (deterministic analysis still works)."
          exit 0

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply database migrations
        run: python scripts/db_migrate.py

      - name: Health check
        run: python -m cr_analyst healthcheck

      - name: Run worker
        run: python -m cr_analyst run --chain-index "${{ github.event.inputs.chain_index || '0' }}"

      - name: Worker summary
        if: always()
        run: |
          echo "### bot-runner" >> "$GITHUB_STEP_SUMMARY"
          echo "- chain index: ${{ github.event.inputs.chain_index || '0' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- reason: ${{ github.event.inputs.reason || github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- job status: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
